name: Build Fritzing (Windows)

# Builds Fritzing for Windows x64 on GitHub-hosted runners, matching the
# exact dependency pins read directly out of this repo's qmake .pri files:
#
#   Qt:      6.5.3 - 6.5.10   (phoenix.pro, QT_LEAST / QT_MOST)
#   boost:   1.85.0, headers only, sibling folder "boost_1_85_0"
#                              (pri/boostdetect.pri)
#   libgit2: 0.28, static, sibling folder "libgit2" with
#            libgit2/include/git2.h and libgit2/build64/Release/git2.lib
#                              (pri/libgit2detect.pri)
#   quazip:  1.4, sibling folder "quazip-6.5.3-1.4intuisphere"
#            *** NOTE: that "intuisphere" suffix is not a typo on my part —
#            it is literally what pri/quazipdetect.pri concatenates on the
#            "develop" branch as of this writing. It looks like an
#            accidental leftover from a find/replace in their repo. If this
#            step fails with "quazip could not be found", open
#            pri/quazipdetect.pri in your fork and check whether that
#            line has been fixed upstream since — the folder name this
#            workflow creates must match it exactly. ***
#
# Folder layout this workflow builds (all siblings, matching the .pri files):
#   D:\fritzing-src\
#     ├── fritzing-app\            (this repo)
#     ├── fritzing-parts\
#     ├── boost_1_85_0\
#     ├── libgit2\
#     └── quazip-6.5.3-1.4intuisphere\

on:
  workflow_dispatch:
  push:
    branches: [ develop, main, master ]

env:
  QT_VERSION: "6.5.3"
  BOOST_VERSION: "1.85.0"
  LIBGIT2_VERSION: "0.28.5"
  QUAZIP_VERSION: "1.4"

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout fritzing-app into fritzing-src/fritzing-app
        uses: actions/checkout@v4
        with:
          path: fritzing-src/fritzing-app

      - name: Checkout fritzing-parts (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-src/fritzing-parts

      - name: Install Qt ${{ env.QT_VERSION }} (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          host: windows
          target: desktop
          modules: "qt5compat qtserialport"
          dir: ${{ github.workspace }}\qt

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and stage Boost headers (sibling folder boost_1_85_0)
        working-directory: fritzing-src
        run: |
          $ver = "${{ env.BOOST_VERSION }}"
          $verUnderscore = $ver -replace '\.', '_'
          $folderName = "boost_$verUnderscore"
          $url = "https://archives.boost.io/release/$ver/source/boost_$verUnderscore.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile boost.zip
          Expand-Archive -Path boost.zip -DestinationPath .
          Write-Host "Staged at $folderName"
          if (-not (Test-Path "$folderName\boost\version.hpp")) {
            throw "Boost headers not found after extraction - check folder name/version"
          }

      - name: Download libgit2 ${{ env.LIBGIT2_VERSION }} source
        working-directory: fritzing-src
        run: |
          $ver = "${{ env.LIBGIT2_VERSION }}"
          $url = "https://github.com/libgit2/libgit2/archive/refs/tags/v$ver.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile libgit2.zip
          Expand-Archive -Path libgit2.zip -DestinationPath .
          Rename-Item -Path "libgit2-$ver" -NewName "libgit2"

      - name: Build libgit2 as a static lib (build64/Release/git2.lib)
        working-directory: fritzing-src/libgit2
        run: |
          # libgit2 0.28's CMakeLists.txt pins a cmake_minimum_required() far
          # older than modern CMake supports. CMAKE_POLICY_VERSION_MINIMUM
          # tells CMake to configure it anyway using >=3.5 policy behavior.
          # Using an array + call operator here instead of backtick line
          # continuations, since backticks before a bare numeric arg like
          # 3.5 can get mis-tokenized by PowerShell into "3" and ".5".
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build64",
            "-A", "x64",
            "-DBUILD_SHARED_LIBS=OFF",
            "-DBUILD_CLI=OFF",
            "-DBUILD_TESTS=OFF",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_BUILD_TYPE=Release"
          )
          & cmake @cmakeArgs
          cmake --build build64 --config Release -- /m
          if (-not (Test-Path "build64\Release\git2.lib")) {
            throw "git2.lib was not produced - check the cmake/build output above"
          }

      - name: Install vcpkg dependencies (zlib for QuaZip, polyclipping/Clipper1 for Fritzing)
        run: vcpkg install zlib:x64-windows polyclipping:x64-windows

      - name: Stage Clipper1-6.4.2 from vcpkg (expected sibling folder layout)
        working-directory: fritzing-src
        run: |
          New-Item -ItemType Directory -Path "Clipper1-6.4.2/include/polyclipping" -Force
          New-Item -ItemType Directory -Path "Clipper1-6.4.2/lib" -Force
          Copy-Item "C:/vcpkg/installed/x64-windows/include/polyclipping/clipper.hpp" "Clipper1-6.4.2/include/polyclipping/"
          Copy-Item "C:/vcpkg/installed/x64-windows/lib/polyclipping.lib" "Clipper1-6.4.2/lib/"
          if (-not (Test-Path "Clipper1-6.4.2/lib/polyclipping.lib")) {
            throw "polyclipping.lib not found - check vcpkg install output"
          }

      - name: Download svgpp-1.3.1 (header-only library)
        working-directory: fritzing-src
        run: |
          # svgpp tags use a "v" prefix: v1.3.1, not 1.3.1
          Invoke-WebRequest -Uri "https://github.com/svgpp/svgpp/archive/refs/tags/v1.3.1.zip" -OutFile svgpp.zip
          Expand-Archive -Path svgpp.zip -DestinationPath .
          Remove-Item svgpp.zip
          # GitHub strips the leading "v" when naming the extracted folder
          if (-not (Test-Path "svgpp-1.3.1/include/svgpp")) {
            throw "svgpp headers not found after extraction"
          }

      - name: Download ngspice-42 header (sharedspice.h, only header needed for compile)
        working-directory: fritzing-src
        run: |
          New-Item -ItemType Directory -Path "ngspice-42/include/ngspice" -Force

          # Probe available tags — the tag name varies (e.g. "ngspice-42", "42", etc.)
          Write-Host "Listing ngspice tags..."
          $remoteRefs = & git ls-remote --tags https://github.com/ngspice/ngspice.git 2>&1
          $remoteRefs | Write-Host

          $tag42 = $remoteRefs |
              Where-Object { $_ -match "refs/tags/" -and $_ -notmatch "\^\{\}" } |
              ForEach-Object { ($_ -replace "^[0-9a-f]+\s+refs/tags/", "").Trim() } |
              Where-Object { $_ -match "(^|[^0-9])42$" } |
              Select-Object -First 1

          if ($tag42) {
              Write-Host "Found tag: $tag42 — sparse-cloning src/include"
              git clone --filter=blob:none --sparse --branch $tag42 --depth 1 `
                  https://github.com/ngspice/ngspice.git ngspice-src
          } else {
              Write-Host "No ngspice-42 tag found — cloning default branch for headers"
              git clone --filter=blob:none --sparse --depth 1 `
                  https://github.com/ngspice/ngspice.git ngspice-src
          }
          Push-Location ngspice-src
          git sparse-checkout set src/include
          Pop-Location

          $h1 = "ngspice-src/src/include/ngspice/sharedspice.h"
          $h2 = "ngspice-src/src/include/sharedspice.h"
          if (Test-Path $h1) {
              Copy-Item $h1 "ngspice-42/include/ngspice/sharedspice.h"
          } elseif (Test-Path $h2) {
              Copy-Item $h2 "ngspice-42/include/ngspice/sharedspice.h"
          } else {
              Write-Host "Contents of ngspice-src/src/include:"
              Get-ChildItem -Recurse "ngspice-src/src/include" | Write-Host
              throw "sharedspice.h not found at either expected path"
          }
          Remove-Item -Recurse -Force ngspice-src
          if (-not (Test-Path "ngspice-42/include/ngspice/sharedspice.h")) {
              throw "sharedspice.h was not staged correctly"
          }

      - name: Download and stage quazip (header+lib install layout)
        working-directory: fritzing-src
        run: |
          $qzVer = "${{ env.QUAZIP_VERSION }}"
          $qtVer = "${{ env.QT_VERSION }}"
          # *** see the long note at the top of this file about this folder name ***
          $folderName = "quazip-$qtVer-${qzVer}intuisphere"
          git clone --branch v$qzVer --depth 1 https://github.com/stachenov/quazip.git quazip-src
          $installPrefix = Join-Path (Get-Location) $folderName
          $quazipCmakeArgs = @(
            "-S", "quazip-src",
            "-B", "quazip-src/build",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_INSTALL_PREFIX=$installPrefix",
            "-DQUAZIP_QT_MAJOR_VERSION=6",
            "-DZLIB_ROOT=C:/vcpkg/installed/x64-windows"
          )
          & cmake @quazipCmakeArgs
          cmake --build quazip-src/build --config Release -- /m
          cmake --install quazip-src/build --config Release

      - name: Run qmake
        working-directory: fritzing-src/fritzing-app
        run: |
          $boostVer = "${{ env.BOOST_VERSION }}" -replace '\.', '_'
          $boostRoot = (Resolve-Path "..\boost_$boostVer").Path
          & "$env:QT_ROOT_DIR\bin\qmake.exe" CONFIG+=release DEFINES+=QUAZIP_LIB "boost_root=$boostRoot"

      - name: Build with nmake
        working-directory: fritzing-src/fritzing-app
        run: nmake

      - name: Compile Fritzing translations (.ts → .qm)
        working-directory: fritzing-src/fritzing-app
        run: |
          $tsFiles = Get-ChildItem -Path translations -Filter "*.ts" | Select-Object -ExpandProperty FullName
          if ($tsFiles.Count -eq 0) { Write-Host "No .ts files found"; exit 0 }
          foreach ($ts in $tsFiles) {
            & "$env:QT_ROOT_DIR\bin\lrelease.exe" $ts
          }
          Write-Host "Compiled $($tsFiles.Count) translation files"

      - name: Stage clean deploy folder with Qt DLLs and runtime dependencies
        working-directory: fritzing-src
        run: |
          # Find Fritzing.exe (buried in release64 build tree)
          $exe = Get-ChildItem -Path release64 -Filter "Fritzing.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Fritzing.exe not found under release64" }
          Write-Host "Found: $($exe.FullName)"

          # Create a clean deployment directory (no .obj files)
          $deployDir = (New-Item -ItemType Directory -Path "Fritzing-deploy" -Force).FullName
          Copy-Item $exe.FullName $deployDir

          # Run windeployqt to gather all Qt DLLs into the clean folder
          # (handles PrintSupport, SvgWidgets, OpenGLWidgets, Svg, Network, etc.)
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-compiler-runtime "$deployDir\Fritzing.exe"

          # Copy QuaZip DLL (third-party, not known to windeployqt)
          $qzVer = "${{ env.QUAZIP_VERSION }}"
          $qtVer = "${{ env.QT_VERSION }}"
          $quazipBinDir = "quazip-$qtVer-${qzVer}intuisphere\bin"
          $quazipDll = Get-ChildItem -Path $quazipBinDir -Filter "quazip*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($quazipDll) {
            Write-Host "Copying QuaZip DLL: $($quazipDll.Name)"
            Copy-Item $quazipDll.FullName $deployDir
          } else {
            Write-Host "WARNING: QuaZip DLL not found in $quazipBinDir"
            Get-ChildItem -Path $quazipBinDir -ErrorAction SilentlyContinue | Write-Host
          }

          # Copy zlib DLLs:
          #   zlib1.dll  = vcpkg zlib (what QuaZip links against)
          #   z.dll      = Qt's own bundled zlib (Qt6Core5Compat and others depend on it)
          $zlibDll = "C:/vcpkg/installed/x64-windows/bin/zlib1.dll"
          if (Test-Path $zlibDll) {
            Write-Host "Copying zlib1.dll"
            Copy-Item $zlibDll $deployDir
          } else {
            Write-Host "WARNING: zlib1.dll not found at $zlibDll"
          }
          # z.dll: search Qt bin first, then Git for Windows (which also ships it)
          $zdllCandidates = @(
            "$env:QT_ROOT_DIR\bin\z.dll",
            "C:\Program Files\Git\mingw64\bin\z.dll",
            "C:\Program Files\Git\usr\bin\z.dll"
          )
          $foundZDll = $false
          foreach ($candidate in $zdllCandidates) {
            if (Test-Path $candidate) {
              Write-Host "Copying z.dll from $candidate"
              Copy-Item $candidate $deployDir
              $foundZDll = $true
              break
            }
          }
          if (-not $foundZDll) {
            Write-Host "WARNING: z.dll not found in any known location"
          }

          # Copy Qt DLLs that windeployqt sometimes misses:
          #   Qt6Core5Compat.dll  = Qt5 compatibility module (used by Fritzing)
          foreach ($extraDll in @("Qt6Core5Compat.dll")) {
            $src = "$env:QT_ROOT_DIR\bin\$extraDll"
            if (Test-Path $src) {
              Write-Host "Copying $extraDll"
              Copy-Item $src $deployDir
            } else {
              Write-Host "WARNING: $extraDll not found at $src"
            }
          }

          # Copy Fritzing runtime data folders
          # resources/: bins, fonts, images, parts (FZP + SVG), templates, etc.
          # help/:        HTML help pages
          # sketches/:    example sketch files
          Copy-Item -Recurse -Force "fritzing-app\resources" "$deployDir\resources"
          Copy-Item -Recurse -Force "fritzing-app\help"      "$deployDir\help"
          Copy-Item -Recurse -Force "fritzing-app\sketches"  "$deployDir\sketches"

          # Compiled translations (.qm files produced by lrelease above)
          New-Item -ItemType Directory -Path "$deployDir\translations" -Force | Out-Null
          Get-ChildItem -Path "fritzing-app\translations" -Filter "*.qm" |
              ForEach-Object { Copy-Item $_.FullName "$deployDir\translations\" }

          # fritzing-parts: clone locally so the result is a valid git repository.
          # Fritzing's libgit2 calls git_repository_open() on this folder to read
          # the HEAD commit SHA — if that fails (empty SHA), fapplication.cpp line
          # 909 returns false and ZERO parts load (including built-in Qt resources).
          # Copy-Item -Recurse can produce a broken .git copy; git clone --local
          # always produces a clean, openable repo.
          git clone --local "fritzing-parts" "$deployDir\fritzing-parts"
          $fzpCount = (Get-ChildItem "$deployDir\fritzing-parts" -Filter "*.fzp" -Recurse | Measure-Object).Count
          Write-Host "fritzing-parts: $fzpCount .fzp files in deploy folder"
          if ($fzpCount -eq 0) { throw "fritzing-parts clone produced no .fzp files" }

          Write-Host "=== Deploy folder top-level ==="
          Get-ChildItem $deployDir | Select-Object Name | Write-Host

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows-build-${{ github.run_number }}
          path: fritzing-src/Fritzing-deploy/
          if-no-files-found: error
